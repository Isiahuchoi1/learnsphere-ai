<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - LearnSphere AI</title>

    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <!-- Background -->
    <div class="background-glow"></div>


    <!-- Sign Up Container -->
    <main class="auth-container">

        <!-- Logo -->
        <a href="index.html" class="brand">

            <span class="brand-icon">✦</span>

            <span>LearnSphere AI</span>

        </a>


        <!-- Card -->
        <div class="auth-card">

            <div class="auth-header">

                <h1>Create your account</h1>

                <p>
                    Start your AI-powered learning journey.
                </p>

            </div>


            <!-- Form -->
            <form id="signupForm">

                <!-- Name -->
                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Terms -->
                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        I agree to the Terms of Service and Privacy Policy.
                    </span>

                </label>


                <!-- Button -->
                <button
                    type="submit"
                    class="signup-button"
                >
                    Create Account
                </button>

            </form>


            <!-- Divider -->
            <div class="divider">

                <span>OR</span>

            </div>


            <!-- Google Button -->
            <button
                type="button"
                class="google-button"
                id="googleSignup"
            >

                <span>G</span>

                Continue with Google

            </button>


            <!-- Login -->
            <p class="login-text">

                Already have an account?

                <a href="login.html">
                    Log in
                </a>

            </p>

        </div>


        <!-- Back -->
        <a href="index.html" class="back-home">
            ← Back to LearnSphere AI
        </a>

    </main>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    updateProfile,
    GoogleAuthProvider,
    signInWithPopup
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


// ==========================================
// Firebase Configuration
// ==========================================

const firebaseConfig = {
    apiKey: "PASTE_YOUR_API_KEY_HERE",
    authDomain: "PASTE_YOUR_AUTH_DOMAIN_HERE",
    projectId: "PASTE_YOUR_PROJECT_ID_HERE",
    storageBucket: "PASTE_YOUR_STORAGE_BUCKET_HERE",
    messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID_HERE",
    appId: "PASTE_YOUR_APP_ID_HERE"
};


// ==========================================
// Initialize Firebase
// ==========================================

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
// ==========================================
    // Email / Password Signup
    // ==========================================

    const signupForm =
        document.getElementById("signupForm");


    signupForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;


            // Check passwords

            if (password !== confirmPassword) {

                alert(
                    "Passwords do not match."
                );

                return;

            }


            try {

                const userCredential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                // Save user's name

                await updateProfile(
                    userCredential.user,
                    {
                        displayName: name
                    }
                );


                alert(
                    "Account created successfully! Welcome to LearnSphere AI."
                );


                // Temporary redirect

                window.location.href =
                    "index.html";


            } catch (error) {

                console.error(error);


                if (
                    error.code ===
                    "auth/email-already-in-use"
                ) {

                    alert(
                        "This email is already registered. Please log in instead."
                    );

                } else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    alert(
                        "Please enter a valid email address."
                    );

                } else if (
                    error.code ===
                    "auth/weak-password"
                ) {

                    alert(
                        "Password is too weak. Please use a stronger password."
                    );

                } else {

                    alert(
                        "Signup failed. Please try again."
                    );

                }

            }

        }
    );


    // ==========================================
    // Google Sign-In
    // ==========================================

    const googleSignup =
        document.getElementById("googleSignup");


    googleSignup.addEventListener(
        "click",
        async function() {

            const provider =
                new GoogleAuthProvider();


            try {

                await signInWithPopup(
                    auth,
                    provider
                );


                alert(
                    "Google Sign-In successful! Welcome to LearnSphere AI."
                );


                window.location.href =
                    "index.html";


            } catch (error) {

                console.error(error);


                alert(
                    "Google Sign-In could not be completed. Please try again."
                );

            }

        }
    );

                    </script>

          </body>
</html>
